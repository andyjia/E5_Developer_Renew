#自动调用api保活，加密版
name: Auto Api Task

on:
  release:
    types: [published]
  push:
    branches:
      - master
      - develop
  schedule:
    # Cron times are fixed, so randomness is added inside the job:
    # the workflow fires every 6 hours, then each run randomly decides
    # whether to call Microsoft and waits a random 0-3600s first, making
    # the real renewal requests happen at effectively random times.
    - cron: '0 */6 * * *'
  watch:
    types: [started]
  workflow_dispatch:
   
jobs:
   Task:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Branch Status
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        pip install requests PyNaCl
    - name: Randomly decide whether to run this cycle
      id: random
      run: |
        if (( RANDOM % 2 == 0 )); then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Random delay before calling Microsoft APIs
      if: steps.random.outputs.run == 'true'
      run: sleep $((RANDOM % 3600))
    - name: Call the Microsoft Graph API to get the refresh_token
      if: steps.random.outputs.run == 'true'
      run: |
        echo `date +"%Y-%m-%d %H:%M:%S"` begin > time.log
        python auto_renew_e5.py -i $CONFIG_ID -s $CONFIG_KEY -r $CONFIG_REFRESH
      env:
        CONFIG_ID: ${{ secrets.CONFIG_ID }}
        CONFIG_KEY: ${{ secrets.CONFIG_KEY }}
        CONFIG_REFRESH: ${{ secrets.CONFIG_REFRESH }}
    - name: Update secret CONFIG_REFRESH
      if: always() && hashFiles('refresh_token.txt') != ''
      run: |
        PUBKEY_JSON=$(gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" /repos/${{ github.repository }}/actions/secrets/public-key)
        KEY_ID=$(echo "$PUBKEY_JSON" | jq -r .key_id)
        PUB_KEY=$(echo "$PUBKEY_JSON" | jq -r .key)
        SECRET_VALUE=$(cat refresh_token.txt)
        ENCRYPTED_VALUE=$(python github_secret_encrypt.py -p "$PUB_KEY" -s "$SECRET_VALUE")
        gh api --method PUT -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" /repos/${{ github.repository }}/actions/secrets/CONFIG_REFRESH -f encrypted_value="$ENCRYPTED_VALUE" -f key_id="$KEY_ID"
      env:
        GH_TOKEN: ${{ secrets.E5_API }}
    - name: Commit time.log to keep the scheduled workflow active
      if: steps.random.outputs.run == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add time.log
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore: update last run time"
          git push
        fi
